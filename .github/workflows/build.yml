name: Build Native AOT Single-File Binary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Native AOT
      run: dotnet publish ShieldEnv.csproj -c Release -r win-x64 -o dist/
    - name: Upload Native Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: leakguard-win-x64
        path: dist/leakguard.exe